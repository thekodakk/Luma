<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#352447">
  <title>Luma — Senin alanın.</title>
  <link rel="icon" href="assets/paw.svg" type="image/svg+xml">
  <link rel="stylesheet" href="desktop.css">
</head>
<body>
  <svg class="symbols" aria-hidden="true"><defs>
    <symbol id="home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v11h-6v-7H9v7H3Z"/></symbol>
    <symbol id="palette" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18h1a2 2 0 0 0 1-4 2 2 0 0 1 1-4h3c5 0 3-10-6-10Z"/><path d="M7 9h.01M11 6h.01M16 7h.01M6 14h.01" stroke-width="3"/></symbol>
    <symbol id="screen" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M12 17v4M8 21h8"/></symbol>
    <symbol id="grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10h.01"/></symbol>
    <symbol id="arrow" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></symbol>
    <symbol id="wifi" viewBox="0 0 24 24"><path d="M2 8a16 16 0 0 1 20 0M5 12a11 11 0 0 1 14 0m-10 4a5 5 0 0 1 6 0m-3 4h.01"/></symbol>
    <symbol id="volume" viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3Zm13-1a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></symbol>
    <symbol id="battery" viewBox="0 0 24 24"><rect x="2" y="6" width="17" height="12" rx="2"/><path d="M22 10v4M5 9h11v6H5Z"/></symbol>
    <symbol id="search" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></symbol>
    <symbol id="close" viewBox="0 0 24 24"><path d="m7 7 10 10M7 17 17 7"/></symbol>
  </defs></svg>
  <header class="topbar">
    <button class="brand" id="brand" title="Uygulamalar"><img src="assets/paw.svg" alt=""><span>Luma</span><span class="top-divider"></span><span class="top-context">Masaüstü</span></button>
    <button id="clock" class="clock" aria-label="Tarih ve saat"></button>
    <button id="status" class="status" aria-label="Oturum bilgisi"><svg><use href="#wifi"/></svg><svg><use href="#volume"/></svg><svg><use href="#battery"/></svg><span>Demo</span></button>
  </header>
  <main id="desktop" aria-label="Masaüstü">
    <div class="desktop-shortcuts"><button data-app="files"><img src="assets/files.svg" alt=""><span>Dosyalar</span></button><button data-app="welcome"><img src="assets/paw.svg" alt=""><span>Hoş geldin</span></button></div>
    <section id="welcome-window" class="window welcome-window" aria-label="Luma karşılama" data-window="welcome">
      <header class="titlebar" data-drag="welcome"><div class="window-title"><img src="assets/paw.svg" alt=""><span>Luma'ya hoş geldin</span></div><div class="window-controls"><button data-minimize="welcome" aria-label="Karşılama penceresini küçült">−</button><button data-maximize="welcome" aria-label="Karşılama penceresini büyüt">□</button><button data-close="welcome" class="close-control" aria-label="Karşılama penceresini kapat">×</button></div></header>
      <div class="welcome-shell"><aside class="sidebar"><nav aria-label="Karşılama bölümleri"><button data-page="home" class="selected"><svg><use href="#home"/></svg><span>Başlangıç</span></button><button data-page="appearance"><svg><use href="#palette"/></svg><span>Görünüm</span></button><button data-page="desktop"><svg><use href="#screen"/></svg><span>Masaüstü</span></button><button data-page="apps"><svg><use href="#grid"/></svg><span>Uygulamalar</span></button><button data-page="about"><svg><use href="#info"/></svg><span>Hakkında</span></button></nav><div class="sidebar-bottom"><span class="tiny-line"></span><p>Kendin ol.<br>Bir şeyler üret.</p><span class="version">Luma · 0.2</span></div></aside><div id="welcome-content" class="welcome-content"></div></div>
    </section>
    <section id="terminal-window" class="window terminal-window" aria-label="Terminal demosu" data-window="terminal">
      <header class="titlebar" data-drag="terminal"><div class="window-title"><img src="assets/terminal.svg" alt=""><span>nova@luma: ~</span><span class="title-badge">DEMO</span></div><div class="window-controls"><button data-minimize="terminal" aria-label="Terminali küçült">−</button><button data-maximize="terminal" aria-label="Terminali büyüt">□</button><button data-close="terminal" class="close-control" aria-label="Terminali kapat">×</button></div></header>
      <div class="terminal-body" id="terminal-body"><div class="terminal-greeting"><span class="terminal-user">nova@luma</span><span class="terminal-path"> ~</span><br><span class="terminal-muted">$</span> hello<br>Bir şeyler üretmek için güzel bir gün.<br><span class="terminal-muted">Demo komutlarını görmek için help yaz.</span></div><div id="terminal-history" aria-live="polite"></div><form id="terminal-form" autocomplete="off"><label for="terminal-input">❯</label><input id="terminal-input" aria-label="Terminal demo komutu" spellcheck="false" autocomplete="off"></form></div>
    </section>
    <section id="app-window" class="window app-window hidden" aria-label="Uygulama önizlemesi" data-window="app">
      <header class="titlebar" data-drag="app"><div class="window-title"><img id="app-title-icon" src="assets/files.svg" alt=""><span id="app-title">Dosyalar</span></div><div class="window-controls"><button data-minimize="app" aria-label="Uygulama penceresini küçült">−</button><button data-maximize="app" aria-label="Uygulama penceresini büyüt">□</button><button data-close="app" class="close-control" aria-label="Uygulama penceresini kapat">×</button></div></header><div id="app-content" class="app-content"></div>
    </section>
    <section id="launcher" class="launcher hidden" aria-label="Uygulama başlatıcı"><div class="launcher-search"><svg><use href="#search"/></svg><input id="app-search" aria-label="Uygulama ara" placeholder="Bir şey aç…" autocomplete="off"><kbd>Esc</kbd></div><div class="launcher-heading">SENİN ARAÇLARIN</div><div id="launcher-apps" class="launcher-apps"></div><div class="launcher-footer"><img src="assets/paw.svg" alt=""><span>nova <small>Yerel tasarım oturumu</small></span><button data-app="welcome" title="Karşılama ekranını aç">Hoş geldin ↗</button></div></section>
    <section id="popover" class="popover hidden" aria-live="polite"></section>
  </main>
  <nav class="dock" aria-label="Uygulama çubuğu"><button id="launcher-button" aria-label="Uygulama başlatıcı" data-tip="Uygulamalar"><img src="assets/paw.svg" alt=""></button><span class="dock-divider"></span><button data-app="files" data-tip="Dosyalar" aria-label="Dosyalar"><img src="assets/files.svg" alt=""></button><button data-app="browser" data-tip="Tarayıcı" aria-label="Tarayıcı"><img src="assets/browser.svg" alt=""></button><button data-app="terminal" data-tip="Terminal" aria-label="Terminal"><img src="assets/terminal.svg" alt=""></button><button data-app="code" data-tip="Kod defteri" aria-label="Kod defteri"><img src="assets/code.svg" alt=""></button><button data-app="art" data-tip="Çizim alanı" aria-label="Çizim alanı"><img src="assets/art.svg" alt=""></button><span class="dock-divider"></span><button data-app="settings" data-tip="Görünüm" aria-label="Görünüm ayarları"><img src="assets/settings.svg" alt=""></button></nav>
  <div class="desktop-caption">LUMA <span>DESKTOP PREVIEW / 0.2</span></div><div id="toast" class="toast hidden" role="status"></div>
  <script src="desktop.js"></script>
</body>
</html>
